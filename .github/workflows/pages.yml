name: Deploy website

# Il sito viene ripubblicato ogni 30 minuti e quando cambia il codice.
on:
  push:
    branches: [main]
    paths:
      - "potd/**"
      - "web/**"
      - "export_data.py"
      - "data_quality.py"
      - "countries.py"
      - "nicknames.json"
      - "weekly_report.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Una sola pubblicazione alla volta: le corse non si sovrappongono.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_STRIPE_LINK: ${{ vars.STRIPE_LINK }}
          VITE_PAYPAL_LINK: ${{ vars.PAYPAL_LINK }}
          VITE_BUYMEACOFFEE_LINK: ${{ vars.BUYMEACOFFEE_LINK }}
          VITE_MONTHLY_COSTS_EUR: ${{ vars.MONTHLY_COSTS_EUR }}
          VITE_DONATED_THIS_MONTH_EUR: ${{ vars.DONATED_THIS_MONTH_EUR }}
          VITE_SUPPORTERS: ${{ vars.SUPPORTERS }}
          VITE_PINT_PRICE_EUR: ${{ vars.PINT_PRICE_EUR }}
        run: |
          npm ci
          npm run build
          python ../export_data.py dist
          python ../weekly_report.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Attendi visibilità artifact github-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then
              echo "Artifact github-pages visibile"
              exit 0
            fi
            echo "Artifact non ancora visibile, riprovo tra 5s ($i/12)"
            sleep 5
          done
          echo "Artifact github-pages non trovato" >&2
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
